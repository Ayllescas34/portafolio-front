name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, pruebas unitarias y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Ubuntu 24.04 blocks the user namespaces that Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: Pruebas end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portafolio
          POSTGRES_PASSWORD: solo-para-ci
          POSTGRES_DB: portafolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portafolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKEND_DIR: api
      TEST_DATABASE_URL: postgresql://portafolio:solo-para-ci@localhost:5432/portafolio_test?schema=public
      JWT_SECRET: solo-para-ci-solo-para-ci-solo-para-ci-solo-para-ci
      JWT_EXPIRES_IN: 2h
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ayllescas34/portafolio-backend
          path: api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm ci
        working-directory: api
      - run: npx prisma generate
        working-directory: api
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
