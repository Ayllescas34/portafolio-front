<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Alejandro Flores Yllescas | Analista Programador Full Stack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portafolio profesional de Alejandro Flores Yllescas, Analista Programador Full Stack: desarrollo y modernización de aplicaciones, .NET 8, bases de datos, pruebas, DevOps, OpenShift e IIS."
    />
    <meta name="author" content="Alejandro Flores Yllescas" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Alejandro Flores Yllescas" />
    <meta property="og:title" content="Alejandro Flores Yllescas | Analista Programador Full Stack" />

      property="og:description"
      content="Desarrollo, modernización y despliegue de aplicaciones empresariales: frontend, backend, bases de datos, pruebas y DevOps."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved theme before Angular boots to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('portfolio.theme');
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = saved || (light ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Este portafolio necesita JavaScript para mostrar su contenido.
      </p>
    </noscript>
  </body>
</html>
